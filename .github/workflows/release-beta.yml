name: Publish Beta Release

on:
  push:
    tags:
      - "beta-v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned beta app
        run: |
          xcodebuild \
            -project "Leader Key.xcodeproj" \
            -scheme "Leader Key Beta" \
            -configuration Beta \
            -destination "platform=macOS" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/build" \
            build

      - name: Package beta app
        id: package
        run: |
          archive_path="$RUNNER_TEMP/Leader-Key-Beta-${GITHUB_REF_NAME}.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/build/Leader Key Beta.app" \
            "$archive_path"
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.archive_path }}" \
            --prerelease \
            --generate-notes
