# Trigger build 1
name: Appcast

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  call-workflow:
    if: github.event_name != 'release' || !github.event.release.prerelease
    uses: mikker/appcast-workflow/.github/workflows/appcast.yml@main
    secrets: inherit
    permissions:
      pages: write
      id-token: write
